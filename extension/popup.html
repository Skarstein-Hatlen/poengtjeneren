<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <title>Pointmaxing</title>
    <style>
      body {
        margin: 0;
        width: 300px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #13203d;
        background: #faf7f0;
      }
      .topp {
        background: #0b1f4b;
        color: #f4f7fc;
        padding: 12px 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 13px;
      }
      main {
        padding: 14px 16px 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 7px 0;
        border-top: 1px solid #d8d1c0;
      }
      li:first-child {
        border-top: 0;
      }
      .sats {
        color: #6d7385;
        font-size: 12px;
      }
      .poeng {
        font-weight: 700;
        font-size: 18px;
        white-space: nowrap;
      }
      .best .poeng {
        color: #0b1f4b;
      }
      .tom {
        color: #6d7385;
        margin: 0 0 10px;
      }
      a.knapp {
        display: inline-block;
        margin-top: 12px;
        padding: 7px 14px;
        border-radius: 999px;
        background: #0b1f4b;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
      }
      .fot {
        margin: 12px 0 0;
        font-size: 11px;
        color: #6d7385;
      }
      li > span:first-child i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: 1px;
      }
      .niva {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        font-size: 13px;
        color: #6d7385;
      }
      .niva select {
        font: inherit;
        color: #13203d;
        background: #fff;
        border: 1px solid #d8d1c0;
        border-radius: 999px;
        padding: 4px 10px;
      }
      .rad-knapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0 0;
      }
      .rad-knapper .knapp {
        margin-top: 0;
      }
      .folg {
        border: 0;
        background: none;
        padding: 0;
        font-size: 13px;
        font-weight: 600;
        color: #6d7385;
        cursor: pointer;
      }
      .folg.aktiv {
        color: #a5780b;
      }
      .etikett {
        margin: 12px 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6d7385;
      }
      a.stille {
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      a.stille:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="topp">Pointmaxing</div>
    <main>
      <div id="innhold"><p class="tom">Leser siden …</p></div>
    </main>
    <script src="felles.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
