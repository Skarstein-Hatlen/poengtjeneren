name: Hent satser

on:
  schedule:
    - cron: '0 4 * * *' # hver dag 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run hent
      # Klarnas vekslingskurs til EuroBonus står på medlemskapssidene – hentes hver dag.
      - run: node scripts/hent-klarna-kurs.mjs
      # Partner-, kort- og medlemskapskampanjer fra offisielle sider.
      - run: node scripts/hent-kampanjer.mjs
      # Tilbud som ikke ble lest (endret ordlyd på en side) blir et issue, så de ikke forsvinner i stillhet.
      - name: Varsle om kampanjer som ikke ble lest
        if: hashFiles('kampanjesjekk.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eksisterende=$(gh issue list --label kampanjesjekk --state open --json number --jq '.[0].number')
          if [ -n "$eksisterende" ]; then
            gh issue comment "$eksisterende" --body-file kampanjesjekk.txt
          else
            gh label create kampanjesjekk --color 1D76DB --description "Kampanjer som ikke ble lest av hent-kampanjer" 2>/dev/null || true
            gh issue create --title "Kampanjesjekk $(date -u +%d.%m.%Y)" --label kampanjesjekk --body-file kampanjesjekk.txt
          fi
      - run: npm run utvidelse
      - run: npm test
      - name: Commit og push hvis satsene endret seg
        id: commit
        run: |
          git add -N public/logos
          if git diff --quiet -- src/data/stores.json src/data/history.json src/data/programs.json src/data/kampanjer.json public/logos extension/manifest.json extension/manifest.firefox.json; then
            echo "Ingen endringer."
            echo "endret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stores.json src/data/history.json src/data/programs.json src/data/kampanjer.json public/logos extension/manifest.json extension/manifest.firefox.json
          git commit -m "Oppdaterte butikksatser $(date -u +%d.%m.%Y)"
          git push
          echo "endret=true" >> "$GITHUB_OUTPUT"
      # Push med GITHUB_TOKEN starter ikke deploy-workflowen av seg selv, så vi starter den her – hver dag, også uten nye
      # satser, så ukens SoMe-poster (scripts/publiser-some.mjs) og datoene på sidene følger kalenderen.
      - name: Deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
